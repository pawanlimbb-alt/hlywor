<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · HlyWor</title>
  <meta name="description" content="This note seems to have blown away or never existed. Head back to the board.">
  <meta name="theme-color" content="#2a1f14">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --board: #2a1f14;
      --paper: #faf6ee;
      --paper2: #f5edd8;
      --paper3: #ede3c8;
      --ink: #1a1208;
      --ink2: #3d3020;
      --ink3: #6a5840;
      --fire: #e8681a;
      --gold: #d4a020;
      --tape-y: #f0c030;
      --pixel: 'Press Start 2P', monospace;
      --serif: 'Crimson Pro', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
      --hand: 'Caveat', cursive;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; }
    body {
      background: var(--board);
      font-family: var(--serif);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Cork texture background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse at 15% 20%, rgba(100,70,30,0.35) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 75%, rgba(70,45,15,0.3) 0%, transparent 45%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.1'/%3E%3C/svg%3E");
      background-size: auto, auto, 200px 200px;
      pointer-events: none;
      z-index: 0;
    }

    .error-sheet {
      position: relative;
      z-index: 2;
      background: var(--paper);
      max-width: 520px;
      width: 100%;
      padding: 44px 36px 40px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
      transform: rotate(-1deg);
      border-radius: 2px;
      text-align: center;
    }

    .pin {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff6b6b, #cc2222);
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .pin::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 12px;
      background: linear-gradient(to bottom, #888, #444);
    }

    .error-code {
      font-family: var(--pixel);
      font-size: 2.8rem;
      color: var(--fire);
      letter-spacing: 4px;
      margin-bottom: 12px;
      text-shadow: 2px 2px 0px var(--paper3);
    }

    .error-title {
      font-family: var(--serif);
      font-size: 1.8rem;
      font-weight: 300;
      font-style: italic;
      color: var(--ink);
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .error-msg {
      font-family: var(--sans);
      font-size: 0.95rem;
      color: var(--ink3);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn-sticky {
      font-family: var(--hand);
      font-size: 1.1rem;
      font-weight: 600;
      padding: 10px 22px;
      background: var(--tape-y);
      color: var(--ink);
      border: none;
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      box-shadow: 2px 3px 8px rgba(0,0,0,0.25);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-sticky:hover {
      transform: translateY(-2px) rotate(0deg);
      box-shadow: 3px 6px 14px rgba(0,0,0,0.3);
    }
    .btn-sticky.fire {
      background: var(--fire);
      color: #fff;
    }

    .footer-logo {
      font-family: var(--pixel);
      font-size: 0.6rem;
      color: var(--gold);
      letter-spacing: 3px;
      margin-top: 32px;
      display: block;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="error-sheet">
    <div class="pin" aria-hidden="true"></div>
    <div class="error-code">404</div>
    <h1 class="error-title">This note blew away.</h1>
    <p class="error-msg">
      The story or page you were looking for doesn't exist, was moved, or slipped off the board into the breeze.
    </p>

    <div class="nav-buttons">
      <a href="index.html" class="btn-sticky fire">← Back to Board</a>
      <a href="posts.html" class="btn-sticky">Browse Stories</a>
      <a href="character.html" class="btn-sticky">The Crew</a>
    </div>

    <span class="footer-logo">HlYWoR</span>
  </div>
</body>
</html>
